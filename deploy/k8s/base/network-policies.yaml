# Only the API may talk to MCP servers; MCP servers are not reachable from anywhere else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-only-from-api
spec:
  podSelector:
    matchLabels: {tier: mcp}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: api}
      ports:
        - {port: 8000}
---
# Ollama reachable only from the API and MCP servers (docs server embeds queries).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-from-app
spec:
  podSelector:
    matchLabels: {app: ollama}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: api}
        - podSelector:
            matchLabels: {tier: mcp}
      ports:
        - {port: 11434}
